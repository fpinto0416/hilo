name: Daily Python Job

on:
  # on:schedule removido em 01/09 -- provou ser fonte de risco, nao rede
  # de seguranca, nos outros 6 repos migrados (ver
  # omqs_futuros_5tf/CLAUDE.md). O cron da VPS (workflow_dispatch via gh
  # workflow run) e o gatilho real agora.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hilo-diario
  cancel-in-progress: false

jobs:
  run-script:
    # Runner proprio (01/09) -- Chrome/Selenium nunca foi de fato usado
    # pelo pipeline (era so um passo morto do workflow) e o TradingView
    # saiu de cena no mesmo dia (projeto_hilo.py passou a estimar o OHLC
    # de hoje via candles de 1h do yfinance) -- sem mais nenhum motivo
    # pra manter este repo fora da VPS dedicada dos outros 6.
    runs-on: [self-hosted, self-hosted-hilo]
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python projeto_hilo.py

      - name: Salvar histórico de ordens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico_ordens.xlsx historico_diario.xlsx
          git diff --staged --quiet || git commit -m "chore: atualiza histórico de ordens $(date +'%Y-%m-%d')"
          # rebase antes do push -- evita perder a rodada se colidir com
          # outro commit (rerun manual, ou rodada agendada disparando
          # atrasada) -- mesma classe de bug já vista em outros repos.
          git fetch origin main
          git rebase origin/main
          git push
